<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>약속 (Yaksok) — 모두를 위한 의약품 식별 · 복약 가이드</title>
<meta name="description" content="약속(Yaksok)은 스마트폰 카메라로 의약품을 식별하고, 복약 정보를 누구나 이해할 수 있는 쉬운 말로 읽어드리는 배리어프리 복약 가이드 앱입니다.">
<meta name="theme-color" content="#F8FAFC">
<link rel="icon" href="assets/app-icon.png">
<link rel="stylesheet" href="colors_and_type.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..700,0..1,0&display=block">
<style>
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
  }
  html, body { margin: 0; padding: 0; }

  /* ---- Homepage semantic surfaces, derived from the Yaksok tokens ---- */
  :root {
    --page-bg:     #F8FAFC;
    --section-alt: #FFFFFF;
    --card-bg:     #FFFFFF;
    --card-border: rgba(26,26,26,0.08);
    --hairline:    rgba(26,26,26,0.08);
    --glass-nav:   rgba(248,250,252,0.72);
    --shadow-card: 0 1px 2px rgba(16,24,40,0.04), 0 12px 32px rgba(16,24,40,0.06);
    --shadow-phone:0 40px 90px rgba(16,24,40,0.22), 0 0 0 1px rgba(16,24,40,0.06);
    --bezel:       #0E0E10;
    --max:         1180px;
  }
  [data-theme="dark"] {
    --page-bg:     #131316;
    --section-alt: #17181B;
    --card-bg:     #1D1E22;
    --card-border: rgba(255,255,255,0.10);
    --hairline:    rgba(255,255,255,0.08);
    --glass-nav:   rgba(19,19,22,0.72);
    --shadow-card: 0 1px 2px rgba(0,0,0,0.4), 0 16px 40px rgba(0,0,0,0.45);
    --shadow-phone:0 40px 90px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.06);
    --bezel:       #050506;
  }

  body {
    font-family: var(--font-sans);
    background: var(--page-bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow-x: hidden;
    word-break: keep-all;
    overflow-wrap: break-word;
  }
  .msr {
    font-family: 'Material Symbols Rounded';
    font-weight: normal; font-style: normal; line-height: 1;
    display: inline-block; white-space: nowrap; direction: ltr;
    -webkit-font-feature-settings: 'liga'; -webkit-font-smoothing: antialiased; user-select: none;
  }
  a { color: inherit; }
  ::selection { background: rgba(0,102,255,0.18); }

  /* focus visibility — accessibility */
  :focus-visible { outline: 3px solid var(--primary); outline-offset: 3px; border-radius: 6px; }
  .skip-link {
    position: fixed; top: 12px; left: 12px; z-index: 200;
    background: var(--primary); color: #fff; padding: 12px 18px; border-radius: 10px;
    font-weight: 700; font-size: 15px; transform: translateY(-150%); transition: transform .2s;
    text-decoration: none;
  }
  .skip-link:focus { transform: translateY(0); }

  /* wave + fade keyframes (mirrors the app's AnimWave) */
  @keyframes ykwave { from { transform: scaleY(0.32); } to { transform: scaleY(1); } }
  @keyframes ykfade { from { opacity: .45; } to { opacity: 1; } }
  @keyframes ykrise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes ykpulse { 0%,100% { opacity: .5; transform: scale(1); } 50% { opacity: 1; transform: scale(1.04); } }

  .reveal { transition: opacity .7s cubic-bezier(.22,.61,.36,1), transform .7s cubic-bezier(.22,.61,.36,1); }
  .reveal.armed { opacity: 0; transform: translateY(16px); }
  .reveal.armed.in { opacity: 1; transform: none; }
  @media (prefers-reduced-motion: reduce) { .reveal { transition: none; } .reveal.armed { opacity: 1 !important; transform: none !important; } }

  #root { min-height: 100vh; }

  /* ---- Responsive ---- */
  @media (max-width: 900px) {
    .nav-links { display: none !important; }
    .hero-grid { grid-template-columns: 1fr !important; gap: 40px !important; }
    .demo-grid { grid-template-columns: 1fr !important; gap: 36px !important; }
    .acc-grid  { grid-template-columns: repeat(2, 1fr) !important; }
  }
  @media (max-width: 760px) {
    .stat-grid-4 { grid-template-columns: repeat(2, 1fr) !important; }
    .stat-grid-3 { grid-template-columns: 1fr !important; }
    .foot-grid   { grid-template-columns: 1fr !important; gap: 32px !important; }
  }
  @media (max-width: 560px) {
    .nav-cta span { display: none; }
    .nav-cta { padding: 0 12px !important; }
    .stat-grid-4 { grid-template-columns: 1fr !important; }
    .acc-grid  { grid-template-columns: 1fr !important; }
  }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="src/i18n.jsx"></script>
  <script type="text/babel" src="src/kit.jsx"></script>
  <script type="text/babel" src="src/sections-1.jsx"></script>
  <script type="text/babel" src="src/sections-2.jsx"></script>
  <script type="text/babel" src="src/app.jsx"></script>
</body>
</html>
