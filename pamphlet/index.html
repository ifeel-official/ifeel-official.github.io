<!doctype html>
<html lang="ko" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>약속 (Yaksok) 음성 안내 — 팜플렛</title>
    <meta
      name="description"
      content="시각장애인을 위한 의약품 식별 앱 '약속' 팜플렛 음성 안내 페이지입니다."
    />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="../assets/app-icon.png" />
    <link rel="stylesheet" href="../colors_and_type.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..700,0..1,0&display=block"
    />
    <style>
      .msr {
        font-family: "Material Symbols Rounded";
        font-weight: normal;
        font-style: normal;
        line-height: 1;
        display: inline-block;
        white-space: nowrap;
        direction: ltr;
        -webkit-font-feature-settings: "liga";
        font-feature-settings: "liga";
        -webkit-font-smoothing: antialiased;
        user-select: none;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }

      :root {
        --page-bg: #f8fafc;
        --card-bg: #ffffff;
        --card-border: rgba(26, 26, 26, 0.08);
        --track-bg: rgba(26, 26, 26, 0.1);
        --page-glow: rgba(0, 102, 255, 0.06);
      }
      [data-theme="dark"] {
        --page-bg: #131316;
        --card-bg: #1d1e22;
        --card-border: rgba(255, 255, 255, 0.1);
        --track-bg: rgba(255, 255, 255, 0.14);
        --page-glow: rgba(51, 133, 255, 0.09);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --page-bg: #131316;
          --card-bg: #1d1e22;
          --card-border: rgba(255, 255, 255, 0.1);
          --track-bg: rgba(255, 255, 255, 0.14);
          --page-glow: rgba(51, 133, 255, 0.09);
        }
      }

      body {
        font-family: var(--font-sans);
        background:
          radial-gradient(
            circle at 50% 32%,
            var(--page-glow) 0%,
            transparent 60%
          ),
          var(--page-bg);
        color: var(--text);
        -webkit-font-smoothing: antialiased;
        word-break: keep-all;
        overflow-wrap: break-word;
        min-height: 100%;
      }
      :focus-visible {
        outline: 3px solid var(--primary);
        outline-offset: 3px;
        border-radius: 6px;
      }

      .wrap {
        max-width: 480px;
        min-height: 100dvh;
        margin: 0 auto;
        padding: 24px 20px;
        display: flex;
        flex-direction: column;
      }

      header.top {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px 0 4px;
      }
      header.top img {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        flex: none;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }
      header.top .name {
        font-size: var(--fs-title);
        font-weight: var(--fw-extrabold);
        letter-spacing: -0.32px;
      }
      header.top .sub {
        font-size: var(--fs-caption);
        color: var(--sub-text);
        font-weight: var(--fw-medium);
        margin-top: 2px;
      }

      .player-stage {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        padding: 24px 0;
      }

      .player-heading {
        text-align: center;
      }
      .player-eyebrow {
        margin: 0 0 8px;
        font-size: var(--fs-caption);
        font-weight: var(--fw-bold);
        letter-spacing: 2px;
        color: var(--primary);
      }
      .player-title {
        margin: 0;
        font-size: var(--fs-headline);
        font-weight: var(--fw-bold);
        letter-spacing: -0.44px;
        line-height: 1.3;
      }
      .player-sub {
        margin: 8px 0 0;
        font-size: var(--fs-label);
        font-weight: var(--fw-medium);
        color: var(--sub-text);
      }

      .player-card {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: var(--r-xl);
        padding: 44px 28px 28px;
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 32px;
        box-shadow:
          0 1px 2px rgba(0, 0, 0, 0.04),
          0 12px 32px rgba(0, 0, 0, 0.08);
      }

      .play-btn {
        flex: none;
        width: 112px;
        height: 112px;
        border-radius: 50%;
        border: none;
        background: linear-gradient(
          145deg,
          var(--primary) 0%,
          color-mix(in srgb, var(--primary) 78%, #001a44) 100%
        );
        color: var(--on-primary);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        padding: 0;
        box-shadow:
          0 8px 24px color-mix(in srgb, var(--primary) 40%, transparent),
          inset 0 1px 0 rgba(255, 255, 255, 0.25);
        transition:
          transform 0.12s ease,
          box-shadow 0.12s ease;
      }
      .play-btn .msr {
        font-size: 52px;
      }
      .play-btn:hover {
        box-shadow:
          0 12px 32px color-mix(in srgb, var(--primary) 50%, transparent),
          inset 0 1px 0 rgba(255, 255, 255, 0.25);
        transform: translateY(-1px);
      }
      .play-btn:active {
        transform: scale(0.96);
      }

      .seek-area {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .seek {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 24px;
        margin: 0;
        background: transparent;
        cursor: pointer;
        --p: 0%;
      }
      .seek::-webkit-slider-runnable-track {
        height: 6px;
        border-radius: 999px;
        background: linear-gradient(
          to right,
          var(--primary) var(--p),
          var(--track-bg) var(--p)
        );
      }
      .seek::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 18px;
        height: 18px;
        margin-top: -6px;
        border-radius: 50%;
        background: var(--card-bg);
        border: 2px solid var(--primary);
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
      }
      .seek::-moz-range-track {
        height: 6px;
        border-radius: 999px;
        background: var(--track-bg);
      }
      .seek::-moz-range-progress {
        height: 6px;
        border-radius: 999px;
        background: var(--primary);
      }
      .seek::-moz-range-thumb {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: var(--card-bg);
        border: 2px solid var(--primary);
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
      }

      .time-row {
        display: flex;
        justify-content: space-between;
        font-size: var(--fs-label);
        font-weight: var(--fw-semibold);
        color: var(--hint-text);
        font-variant-numeric: tabular-nums;
      }
      .time-row .current {
        color: var(--text);
      }

      .cta-row {
        display: flex;
        gap: 12px;
      }
      .btn {
        flex: 1 1 0;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        text-decoration: none;
        font-weight: var(--fw-bold);
        font-size: 16px;
        padding: 16px 14px;
        border-radius: var(--r-lg);
        min-height: 52px;
        transition:
          transform 0.12s ease,
          box-shadow 0.12s ease;
      }
      button.btn {
        font-family: inherit;
        border: none;
        cursor: pointer;
      }
      .btn:active {
        transform: scale(0.98);
      }
      .btn-primary {
        background: var(--primary);
        color: var(--on-primary);
        box-shadow: 0 4px 14px
          color-mix(in srgb, var(--primary) 32%, transparent);
      }
      .btn-primary:hover {
        box-shadow: 0 6px 18px
          color-mix(in srgb, var(--primary) 42%, transparent);
      }
      .btn-secondary {
        background: var(--card-bg);
        color: var(--text);
        border: 1px solid var(--card-border);
      }

      @media (max-width: 380px) {
        .cta-row {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header class="top" aria-hidden="true">
        <img src="../assets/app-icon.png" alt="" />
        <div>
          <div class="name">약속 (Yaksok)</div>
          <div class="sub">시각장애인을 위한 의약품 식별 앱</div>
        </div>
      </header>

      <audio id="guideAudio" preload="metadata">
        <source src="../assets/audio/pamphlet-guide.mp3" type="audio/mpeg" />
        죄송합니다, 사용하시는 브라우저에서 오디오 재생을 지원하지 않습니다.
      </audio>

      <div class="player-stage">
        <div class="player-heading" aria-hidden="true">
          <p class="player-eyebrow">AUDIO GUIDE</p>
          <h1 class="player-title">약속 팜플렛 음성 안내</h1>
          <p class="player-sub">재생 버튼을 눌러 안내를 들어보세요</p>
        </div>

        <div class="player-card">
          <button
            type="button"
            class="play-btn"
            id="playBtn"
            aria-label="약속 팜플렛 음성 안내 재생"
            autofocus
          >
            <span class="msr" id="playIcon" aria-hidden="true">play_arrow</span>
          </button>
          <div class="seek-area">
            <input
              type="range"
              class="seek"
              id="seekBar"
              min="0"
              max="100"
              step="1"
              value="0"
              aria-label="재생 위치"
              aria-hidden="true"
              tabindex="-1"
            />
            <div class="time-row" aria-hidden="true">
              <span class="current" id="currentTimeText">0:00</span>
              <span id="totalTimeText">--:--</span>
            </div>
          </div>
        </div>
      </div>

      <div class="cta-row">
        <button
          type="button"
          class="btn btn-primary"
          id="installBtn"
          aria-label="약속 설치하기, 기기에 맞는 앱스토어로 바로 이동합니다"
        >
          약속 설치하기
        </button>
        <button
          type="button"
          class="btn btn-secondary"
          id="emailBtn"
          aria-label="이메일 문의하기, 기본 메일 앱에서 메일 작성 화면이 열립니다"
        >
          이메일 문의하기
        </button>
      </div>
    </div>

    <script>
      (function () {
        var audio = document.getElementById("guideAudio");
        var playBtn = document.getElementById("playBtn");
        var playIcon = document.getElementById("playIcon");
        var currentTimeText = document.getElementById("currentTimeText");
        var totalTimeText = document.getElementById("totalTimeText");
        var seekBar = document.getElementById("seekBar");
        var durationKo = "";
        var seeking = false;

        function updateSeekText() {
          seekBar.setAttribute(
            "aria-valuetext",
            fmtKo(Number(seekBar.value)) +
              (durationKo ? " / 전체 " + durationKo : ""),
          );
        }

        function fmtKo(sec) {
          sec = Math.max(0, Math.round(sec || 0));
          var m = Math.floor(sec / 60);
          var s = sec % 60;
          return m > 0 ? m + "분 " + s + "초" : s + "초";
        }

        function fmtClock(sec) {
          sec = Math.max(0, Math.floor(sec || 0));
          var m = Math.floor(sec / 60);
          var s = sec % 60;
          return m + ":" + (s < 10 ? "0" + s : s);
        }

        function updateVisual() {
          var val = Number(seekBar.value);
          var max = Number(seekBar.max) || 1;
          currentTimeText.textContent = fmtClock(val);
          seekBar.style.setProperty(
            "--p",
            Math.min(100, (val / max) * 100) + "%",
          );
        }

        function updateLabel() {
          var suffix = durationKo ? ", 전체 재생 시간 " + durationKo : "";
          if (audio.paused) {
            playBtn.setAttribute(
              "aria-label",
              "약속 팜플렛 음성 안내 재생 버튼" + suffix,
            );
          } else {
            playBtn.setAttribute("aria-label", "일시정지 버튼" + suffix);
          }
        }

        audio.addEventListener("loadedmetadata", function () {
          durationKo = fmtKo(audio.duration);
          totalTimeText.textContent = fmtClock(audio.duration);
          seekBar.max = Math.floor(audio.duration);
          updateSeekText();
          updateVisual();
          updateLabel();
        });

        // VoiceOver는 로드 직후 슬라이더를 첫 커서로 잡으므로, 초기 커서가
        // 재생 버튼에 앉을 때까지만 슬라이더를 접근성 트리에서 빼둔다.
        function revealSeek() {
          seekBar.removeAttribute("aria-hidden");
          seekBar.removeAttribute("tabindex");
        }
        window.addEventListener("load", function () {
          setTimeout(revealSeek, 1000);
        });

        audio.addEventListener("timeupdate", function () {
          if (seeking) return;
          seekBar.value = Math.floor(audio.currentTime);
          updateSeekText();
          updateVisual();
        });

        seekBar.addEventListener("input", function () {
          var val = Number(seekBar.value);
          // VoiceOver 스와이프·키보드 화살표는 step(1초)만큼만 값을 바꾸므로,
          // 포인터 드래그가 아닌 ±1초 변화는 10초 점프로 확대한다.
          if (!seeking) {
            var prev = Math.floor(audio.currentTime);
            var delta = val - prev;
            if (delta === 1 || delta === -1) {
              val = Math.min(
                Number(seekBar.max),
                Math.max(0, prev + delta * 10),
              );
              seekBar.value = val;
            }
          }
          audio.currentTime = val;
          updateSeekText();
          updateVisual();
        });
        seekBar.addEventListener("pointerdown", function () {
          seeking = true;
        });
        seekBar.addEventListener("pointerup", function () {
          seeking = false;
          audio.currentTime = Number(seekBar.value);
        });

        audio.addEventListener("play", function () {
          playIcon.textContent = "pause";
          revealSeek();
          updateLabel();
        });
        audio.addEventListener("pause", function () {
          playIcon.textContent = "play_arrow";
          updateLabel();
        });
        audio.addEventListener("ended", function () {
          playIcon.textContent = "play_arrow";
          updateLabel();
        });

        playBtn.addEventListener("click", function () {
          if (audio.paused) audio.play();
          else audio.pause();
        });

        var installBtn = document.getElementById("installBtn");
        var APP_STORE_URL = "https://apps.apple.com/kr/app/id6770225626";
        var PLAY_STORE_URL =
          "https://play.google.com/store/apps/details?id=kr.co.devstory.ifeel.app";

        installBtn.addEventListener("click", function () {
          var ua = navigator.userAgent || "";
          var isIOS = /iPhone|iPad|iPod/i.test(ua);
          var isAndroid = /Android/i.test(ua);
          var target = isIOS
            ? APP_STORE_URL
            : isAndroid
              ? PLAY_STORE_URL
              : PLAY_STORE_URL;
          window.open(target, "_blank", "noopener");
        });

        var emailBtn = document.getElementById("emailBtn");
        emailBtn.addEventListener("click", function () {
          var subject = encodeURIComponent("[약속] 문의드립니다");
          window.location.href =
            "mailto:ifeel.devstory.co.kr@gmail.com?subject=" + subject;
        });
      })();
    </script>
  </body>
</html>
